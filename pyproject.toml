[project]
name = "rag-eval-deepeval"
version = "0.1.0"
description = "A simple transcript retriever with local MiniLM embeddings"
readme = "README.md"
authors = [
    { name = "Prakhar Singh", email = "prakhars156@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=3,<4",
    "groq>=1.7.0",
    "langchain-chroma>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-huggingface>=1.2.3,<2",
    "langchain-text-splitters>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=5.0,<6",
    "torch>=2.9,<3",
]

[project.scripts]
rag-eval-deepeval = "rag_eval_deepeval.retriever:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
